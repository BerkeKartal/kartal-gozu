# Example: publish the image registry at the root of a host of its own;
# docker and the nodes reach it at registry.example.org, as the registry's
# KARTAL_REGISTRY_PUBLIC_URL says. A registry cannot live below a path.
#
# Layers are large and slow to push: nothing on the way may limit a
# request's body or buffer it (no Buffering middleware), and Traefik's
# entry point must not cut a long upload. Its readTimeout is 60 seconds by
# default; raise it in Traefik's static configuration, for example:
#   --entryPoints.websecure.transport.respondingTimeouts.readTimeout=0
# Apply into the registry's namespace and make sure Traefik watches it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kartal-registry
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry.example.org`)
      kind: Rule
      services:
        - name: kartal-registry
          port: 5000
  tls: {}
