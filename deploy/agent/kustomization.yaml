apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace the agent is installed into; pick any name.
namespace: kartal-gozu

resources:
  - rbac.yaml
  - deployment.yaml
  # Browse every resource type (CRDs, Secrets with values redacted):
  # - rbac-browse.yaml
  # Allow restart/scale (also set KARTAL_ALLOW_WRITE to "true"):
  # - rbac-write.yaml

images:
  - name: kartal-gozu
    newName: kartal-gozu # e.g. registry.example.org/library/kartal-gozu
    newTag: latest
