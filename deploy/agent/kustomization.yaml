apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace the agent is installed into; pick any name.
namespace: kartal-gozu

resources:
  - rbac.yaml
  - deployment.yaml
  # Browse every resource type (CRDs, Secrets with values redacted) and list
  # Helm releases, which Helm keeps in Secrets:
  # - rbac-browse.yaml
  # Restart, scale, roll back, delete pods, cordon nodes, run and suspend
  # CronJobs (also set KARTAL_ALLOW_WRITE to "true"):
  # - rbac-write.yaml
  # Run commands in containers, the pod console (also KARTAL_ALLOW_EXEC):
  # - rbac-exec.yaml
  # Save objects edited as YAML (also KARTAL_ALLOW_EDIT):
  # - rbac-edit.yaml
  # How full volumes and node disks are, from the kubelets (also KARTAL_VOLUME_STATS):
  # - rbac-volumes.yaml
  # When the certificates of TLS Secrets expire (also KARTAL_TLS_SECRETS):
  # - rbac-certificates.yaml
  # The metrics pods expose, read through the API server (also
  # KARTAL_POD_METRICS):
  # - rbac-pod-metrics.yaml

images:
  - name: kartal-gozu
    newName: kartal-gozu # e.g. registry.example.org/library/kartal-gozu
    newTag: latest
