# Optional: lets the agent read the metrics that pods expose (such as
# /metrics in the Prometheus text format), through the API server (also set
# KARTAL_POD_METRICS to "true").
# Note that get on pods/proxy reaches any HTTP GET endpoint of every pod,
# not only its metrics. The agent itself only returns what parses as
# metrics, never other pages, but the permission is wider than that; include
# it only if you accept that for the agent's service account. For an agent
# limited to some namespaces, bind the role in those namespaces instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kartal-agent-pod-metrics
rules:
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kartal-agent-pod-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kartal-agent-pod-metrics
subjects:
  - kind: ServiceAccount
    name: kartal-agent
