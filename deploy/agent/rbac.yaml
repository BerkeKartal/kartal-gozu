apiVersion: v1
kind: ServiceAccount
metadata:
  name: kartal-agent
---
# Read-only access to everything the periodic snapshot shows. Secrets are
# deliberately absent; see rbac-browse.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kartal-agent-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "pods/log", "services", "configmaps", "persistentvolumeclaims", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    # ReplicaSets carry a Deployment's rollout history.
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    # NetworkPolicies say why a pod's metrics cannot be read.
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  # Traefik's IngressRoutes, shown next to the Ingresses; a cluster without
  # Traefik simply has none.
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources: ["ingressroutes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/version", "/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kartal-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kartal-agent-read
subjects:
  - kind: ServiceAccount
    name: kartal-agent
