apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The image registry's vulnerability scanner, next to the registry: Trivy
# with the small API the registry calls. It needs the key scanner-secret in
# the server's Secret, which the registry is given too.
namespace: kartal-gozu

resources:
  - deployment.yaml
  - service.yaml
  # Trivy's databases and what it learned of layers (see cache.yaml).
  - cache.yaml
  # Only the registry reaches it; leave it out where nothing enforces
  # NetworkPolicies.
  - networkpolicy.yaml

images:
  - name: kartal-scanner
    newName: kartal-scanner # e.g. registry.example.org/library/kartal-scanner
    newTag: latest
