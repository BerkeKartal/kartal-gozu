apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace the server is installed into; pick any name.
namespace: kartal-gozu

resources:
  - deployment.yaml
  - service.yaml
  # Keeps the settings made in the UI (e-mail) across restarts. Without
  # these two, drop KARTAL_SETTINGS_SECRET from deployment.yaml: settings
  # then last until the server restarts.
  - rbac.yaml
  - settings-secret.yaml
  # The metric store's disk (see data.yaml).
  - data.yaml

images:
  - name: kartal-gozu
    newName: kartal-gozu # e.g. registry.example.org/library/kartal-gozu
    newTag: latest
