apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace the server is installed into; pick any name.
namespace: kartal-gozu

resources:
  - deployment.yaml
  - service.yaml

images:
  - name: kartal-gozu
    newName: kartal-gozu # e.g. registry.example.org/library/kartal-gozu
    newTag: latest
