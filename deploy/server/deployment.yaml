apiVersion: apps/v1
kind: Deployment
metadata:
  name: kartal-server
  labels:
    app.kubernetes.io/name: kartal-server
spec:
  # State and pending commands live in memory and the metric store on one
  # volume, so run exactly one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kartal-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kartal-server
    spec:
      # Its only permission: the settings Secret (rbac.yaml).
      serviceAccountName: kartal-server
      securityContext:
        runAsNonRoot: true
        # The image runs as 65532; the data volume is made writable for it.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: kartal-gozu
          env:
            - name: KARTAL_AGENT_TOKENS_FILE
              value: /etc/kartal/agent-tokens
            - name: KARTAL_ADMIN_TOKEN_FILE
              value: /etc/kartal/admin-token
            # Where the settings made in the UI are kept (settings-secret.yaml).
            - name: KARTAL_SETTINGS_SECRET
              value: kartal-server-settings
            # The metric store, on the claim in data.yaml.
            - name: KARTAL_DATA_DIR
              value: /var/lib/kartal
            # Named users with roles, one "name:grant:token" per line, where a
            # grant is a role (viewer, operator, admin), everywhere, or only in
            # some places: operator@production/payments+staging. Add a "users"
            # key to the Secret first.
            # - name: KARTAL_USERS_FILE
            #   value: /etc/kartal/users
            # Sign-in with Active Directory or another LDAP directory: people
            # use their own password, and their groups give them grants. The
            # service account's password goes in the Secret as well.
            # - name: KARTAL_LDAP_URL
            #   value: ldaps://dc1.example.org:636
            # - name: KARTAL_LDAP_USER_BASE
            #   value: OU=People,DC=example,DC=org
            # - name: KARTAL_LDAP_BIND_DN
            #   value: CN=svc-kartal,OU=Service Accounts,DC=example,DC=org
            # - name: KARTAL_LDAP_BIND_PASSWORD_FILE
            #   value: /etc/kartal/ldap-password
            # - name: KARTAL_LDAP_GROUPS
            #   value: |
            #     Kartal-Admins => admin
            #     Platform-Oncall => operator
            #     Team-Payments => operator@production/payments-*+staging
            #     Developers => viewer
            # Where people open the UI; notifications link to it.
            # - name: KARTAL_PUBLIC_URL
            #   value: https://panel.example.org/devops/kartal
            # Notifications, all optional: a Teams workflow URL, any JSON
            # webhook, and e-mail. E-mail is simplest to set up on the Alerts
            # page; the KARTAL_SMTP_* variables, when set, take its place
            # there (the password goes in the Secret as well).
            # - name: KARTAL_ALERT_TEAMS_URL
            #   value: https://example.webhook.office.com/...
            # - name: KARTAL_ALERT_WEBHOOK_URL
            #   value: https://hooks.example.org/kartal
            # - name: KARTAL_SMTP_ADDR
            #   value: smtp.example.org:587
            # - name: KARTAL_SMTP_FROM
            #   value: kartal@example.org
            # - name: KARTAL_SMTP_TO
            #   value: ops@example.org
            # - name: KARTAL_SMTP_USERNAME
            #   value: kartal
            # - name: KARTAL_SMTP_PASSWORD_FILE
            #   value: /etc/kartal/smtp-password
            # When a volume or a node's disk (in percent full) or a certificate
            # (in days before it expires) needs attention; these are the defaults.
            # - name: KARTAL_ALERT_VOLUME_WARNING
            #   value: "85"
            # - name: KARTAL_ALERT_NODE_DISK_WARNING
            #   value: "80"
            # - name: KARTAL_ALERT_CERT_WARNING_DAYS
            #   value: "14"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /etc/kartal
              readOnly: true
            - name: data
              mountPath: /var/lib/kartal
      volumes:
        - name: secrets
          secret:
            secretName: kartal-server
        - name: data
          persistentVolumeClaim:
            claimName: kartal-server-data
