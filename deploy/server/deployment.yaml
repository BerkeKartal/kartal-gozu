apiVersion: apps/v1
kind: Deployment
metadata:
  name: kartal-server
  labels:
    app.kubernetes.io/name: kartal-server
spec:
  # State and pending commands live in memory, so run exactly one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kartal-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kartal-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: kartal-gozu
          env:
            - name: KARTAL_AGENT_TOKENS_FILE
              value: /etc/kartal/agent-tokens
            - name: KARTAL_ADMIN_TOKEN_FILE
              value: /etc/kartal/admin-token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /etc/kartal
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: kartal-server
