# The server's identity in its own cluster. It may read and change one
# Secret, where it keeps the settings made in the UI (settings-secret.yaml),
# and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kartal-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kartal-server-settings
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kartal-server-settings"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kartal-server-settings
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kartal-server-settings
subjects:
  - kind: ServiceAccount
    name: kartal-server
